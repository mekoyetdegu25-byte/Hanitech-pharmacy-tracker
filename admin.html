<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin - Pharmacy Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #f0f4f8; color: #1a202c; padding-bottom: 40px; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  
  header { background: linear-gradient(135deg, #2b6cb0, #2c5282); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
  header h1 { font-size: 20px; }
  
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .card h2 { font-size: 16px; margin-bottom: 15px; color: #2b6cb0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
  
  .form-group { margin-bottom: 15px; }
  label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #4a5568;}
  input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; }
  
  .btn { padding: 10px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #2b6cb0; color: white; width: 100%; }
  .btn-danger { background: #e53e3e; color: white; }
  .btn-success { background: #38a169; color: white; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  
  .login-box { max-width: 400px; margin: 80px auto; }
  .hidden { display: none !important; }
  
  .hotel-item { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
  .hotel-info h3 { font-size: 15px; margin-bottom: 5px; }
  .hotel-info p { font-size: 12px; color: #718096; }
  
  .alert-item { background: #fff5f5; border: 1px solid #fed7d7; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
  .alert-item p { font-size: 13px; color: #c53030; font-weight: bold;}
</style>
</head>
<body>

<!-- የመግቢያ ገጽ -->
<div id="loginScreen" class="login-box">
  <div class="card">
    <h2 style="text-align:center;">🔐 Super Admin</h2>
    <div class="form-group"><label>Email</label><input type="email" id="adminEmail" placeholder="admin@hanitech.com"></div>
    <div class="form-group"><label>Password</label><input type="password" id="adminPass" placeholder="••••••••"></div>
    <button class="btn btn-primary" onclick="login()">🔓 ግባ</button>
    <p id="loginError" style="color:red; text-align:center; margin-top:10px; font-size:13px; display:none;"></p>
  </div>
</div>

<!-- ዋና ገጽ -->
<div id="mainApp" class="container hidden">
  <header>
    <h1>👑 Super Admin Panel</h1>
    <button class="btn btn-danger btn-sm" onclick="logout()">ውጣ</button>
  </header>

  <!-- የፓስወርድ ጥያቄዎች -->
  <div class="card">
    <h2>🔔 የፓስወርድ ጥያቄዎች</h2>
    <div id="alertsList"><p style="font-size:13px; color:#a0aec0;">በመጫን ላይ...</p></div>
  </div>

  <!-- አዲስ ፋርማሲ መጨመሪያ -->
  <div class="card">
    <h2>➕ አዲስ ፋርማሲ ጨምር</h2>
    <div class="form-group"><label>የፋርማሲ ስም</label><input type="text" id="phName" placeholder="ለምሳሌ: Hanitech Pharmacy"></div>
    <div class="form-group"><label>የባለቤት Email (ትክክለኛ Gmail)</label><input type="email" id="phEmail" placeholder="owner@gmail.com"></div>
    <div class="form-group"><label>Password</label><input type="text" id="phPass" value="123456"></div>
    <div class="form-group"><label>ወርሃዊ ክፍያ (ብር)</label><input type="number" id="phPrice" value="500"></div>
    <button class="btn btn-primary" onclick="addPharmacy()" id="addBtn">💾 ፋርማሲ ጨምር</button>
    <p id="addStatus" style="margin-top:10px; font-size:13px;"></p>
  </div>

  <!-- የፋርማሲዎች ዝርዝር -->
  <div class="card">
    <h2>📋 የፋርማሲዎች ዝርዝር</h2>
    <div id="pharmaciesList"><p style="font-size:13px; color:#a0aec0;">በመጫን ላይ...</p></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc, serverTimestamp, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

  // 🚨 እዚህ ጋር የፋርማሲውን firebaseConfig አስገባ
  const firebaseConfig = {
    apiKey: "AIzaSyB3bQkI8scEHg36kkxlAalbbCtE4R0Vv8U",
    authDomain: "hanitech-pharmacy-tracker.firebaseapp.com",
    projectId: "hanitech-pharmacy-tracker",
    storageBucket: "hanitech-pharmacy-tracker.firebasestorage.app",
    messagingSenderId: "692991067588",
    appId: "1:692991067588:web:5f0cab885c4aaa64785091"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  
  // 🚨 እርስዎ የሚጠቀሙበት የአድሚን ኢሜይል
  const ADMIN_EMAIL = "admin@hanitech.com"; 

  let secondaryApp;
  let secondaryAuth;
  try {
    secondaryApp = initializeApp(firebaseConfig, 'secondary');
    secondaryAuth = getAuth(secondaryApp);
  } catch(e) {}

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ADMIN_EMAIL) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      loadPharmacies();
      loadAlerts();
    } else {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('mainApp').classList.add('hidden');
    }
  });

  window.login = async function() {
    const email = document.getElementById('adminEmail').value;
    const pass = document.getElementById('adminPass').value;
    const err = document.getElementById('loginError');
    err.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      err.textContent = 'ስህተት: Email ወይም Password ትክክል አይደለም';
      err.style.display = 'block';
    }
  };

  window.logout = function() { signOut(auth); };

  // --- ፋርማሲ መጨመር ---
  window.addPharmacy = async function() {
    const name = document.getElementById('phName').value.trim();
    const email = document.getElementById('phEmail').value.trim();
    const pass = document.getElementById('phPass').value.trim();
    const price = parseFloat(document.getElementById('phPrice').value);
    const statusEl = document.getElementById('addStatus');

    if (!name || !email || !pass || isNaN(price)) {
      statusEl.textContent = '⚠️ ሁሉንም መስኮች ሙላ!';
      statusEl.style.color = 'red';
      return;
    }

    document.getElementById('addBtn').disabled = true;
    statusEl.textContent = '⏳ በመፍጠር ላይ...';
    statusEl.style.color = '#2b6cb0';

    try {
      // 1. ተጠቃሚ ፍጠር
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
      const uid = cred.user.uid;
      await signOut(secondaryAuth); // ወዲያውኑ ውጣ

      // 2. ፋርማሲውን በዳታቤዝ መዝግብ
      const phId = 'pharmacy-' + Date.now();
      await setDoc(doc(db, 'pharmacies', phId), {
        name, ownerEmail: email, ownerUid: uid, monthlyPrice: price, status: 'active', createdAt: serverTimestamp()
      });

      // 3. የተጠቃሚውን ሚና መዝግብ
      await setDoc(doc(db, 'users', uid), {
        email, role: 'owner', pharmacyId: phId, createdAt: serverTimestamp()
      });

      statusEl.textContent = '✅ ፋርማሲው ተፈጥሯል!';
      statusEl.style.color = '#38a169';
      
      document.getElementById('phName').value = '';
      document.getElementById('phEmail').value = '';
      loadPharmacies();

    } catch (e) {
      statusEl.textContent = '⚠️ ስህተት: ' + e.message;
      statusEl.style.color = 'red';
    } finally {
      document.getElementById('addBtn').disabled = false;
    }
  };

  // --- ፋርማሲዎችን ማምጣት ---
  async function loadPharmacies() {
    const listEl = document.getElementById('pharmaciesList');
    try {
      const snap = await getDocs(collection(db, 'pharmacies'));
      if (snap.empty) {
        listEl.innerHTML = '<p style="font-size:13px; color:#a0aec0;">ምንም ፋርማሲ የለም።</p>';
        return;
      }
      let html = '';
      snap.forEach(d => {
        const p = d.data();
        html += `
          <div class="hotel-item">
            <div class="hotel-info">
              <h3>🏥 ${p.name}</h3>
              <p>📧 ${p.ownerEmail} | 💰 ${p.monthlyPrice} ብር/ወር</p>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deletePharmacy('${d.id}', '${p.ownerUid}')">🗑️ አጥፋ</button>
          </div>
        `;
      });
      listEl.innerHTML = html;
    } catch(e) {
      listEl.innerHTML = '<p style="color:red;">ስህተት ተፈጥሯል</p>';
    }
  }

  window.deletePharmacy = async function(id, uid) {
    if (!confirm('ይህን ፋርማሲ ማጥፋት ትፈልጋለህ?')) return;
    try {
      await deleteDoc(doc(db, 'pharmacies', id));
      if (uid) await deleteDoc(doc(db, 'users', uid));
      loadPharmacies();
    } catch(e) { alert('ስህተት: ' + e.message); }
  }

  // --- የፓስወርድ ጥያቄዎችን ማምጣት ---
  async function loadAlerts() {
    const listEl = document.getElementById('alertsList');
    try {
      const q = query(collection(db, 'adminAlerts'), where('status', '==', 'pending'));
      const snap = await getDocs(q);
      if (snap.empty) {
        listEl.innerHTML = '<p style="font-size:13px; color:#a0aec0;">ምንም ጥያቄ የለም።</p>';
        return;
      }
      let html = '';
      snap.forEach(d => {
        const a = d.data();
        html += `
          <div class="alert-item">
            <p>📧 ${a.email}</p>
            <button class="btn btn-success btn-sm" onclick="resolveAlert('${d.id}', '${a.email}')">✅ ተፈትቷል</button>
          </div>
        `;
      });
      listEl.innerHTML = html;
    } catch(e) {}
  }

  window.resolveAlert = async function(id, email) {
    try {
      await updateDoc(doc(db, 'adminAlerts', id), { status: 'resolved' });
      loadAlerts();
    } catch(e) {}
  }
</script>

</body>
</html>

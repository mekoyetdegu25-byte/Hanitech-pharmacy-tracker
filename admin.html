<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Admin Panel - Hanitech</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #f0f4f8; color: #1a202c; font-size: 15px; padding-bottom: 80px; max-width: 900px; margin: 0 auto; min-height: 100vh; }
  #adminLogin { position: fixed; inset: 0; background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 50%, #3182ce 100%); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
  .login-box { background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 32px 24px; width: 100%; max-width: 400px; }
  .login-box h1 { text-align: center; color: #1a365d; font-size: 20px; margin-bottom: 20px; font-weight: 800;}
  .form-group { margin-bottom: 16px; }
  input, select { width: 100%; padding: 14px; font-size: 15px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #f7fafc; outline: none; }
  input:focus, select:focus { border-color: #3182ce; background: #fff; }
  .btn-login { width: 100%; padding: 15px; font-size: 16px; font-weight: 800; border: none; border-radius: 12px; background: linear-gradient(135deg, #1a365d, #2c5282); color: #fff; cursor: pointer; margin-top: 8px; }
  #adminApp { display: none; }
  header { background: linear-gradient(135deg, #1a365d, #2c5282); color: #fff; padding: 16px; border-radius: 0 0 16px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .btn-logout-hdr { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .container { padding: 0 14px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 14px; padding: 20px 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .stat-card .value { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
  .stat-card .label { font-size: 12px; color: #718096; font-weight: 600; }
  .val-blue { color: #2b6cb0; } .val-green { color: #276749; } .val-red { color: #c53030; } .val-orange { color: #dd6b20; }
  .section-collapsible { background: #fff; border-radius: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); overflow: hidden; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; cursor: pointer; }
  .section-header .sec-left { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; color: #2d3748; }
  .section-header .badge { background: #c53030; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
  .section-header .sec-arrow { font-size: 12px; font-weight: 900; color: #4a5568; transition: transform 0.2s; }
  .section-header.open .sec-arrow { transform: rotate(90deg); }
  .section-body { display: none; padding: 0 16px 16px 16px; border-top: 1px solid #edf2f7; padding-top: 16px; }
  .section-body.open { display: block; }
  .btn { display: block; width: 100%; padding: 12px; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; text-align: center; text-decoration: none; color: #fff; margin-bottom: 6px;}
  .btn-sm { padding: 8px; font-size: 12px; border-radius: 6px; }
  .btn-success { background: #276749; } .btn-primary { background: #2c5282; } .btn-danger { background: #c53030; } .btn-warning { background: #dd6b20; } .btn-info { background: #3182ce; } .btn-outline { background: transparent; border: 1.5px solid #cbd5e0; color: #4a5568; }
  .tenant-card { background: #fff; border: 1px solid #edf2f7; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
  .tenant-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed #edf2f7; padding-bottom: 10px; margin-bottom: 10px; }
  .tenant-title { font-size: 16px; font-weight: 800; color: #2c5282; display: flex; align-items: center; gap: 6px; }
  .tenant-website { font-size: 12px; color: #3182ce; text-decoration: none; }
  .tenant-info { font-size: 13px; margin-bottom: 6px; color: #4a5568; display: flex; align-items: center; gap: 6px; }
  .tenant-info strong { color: #2d3748; }
  .badge-status { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 6px; }
  .status-active { background: #c6f6d5; color: #22543d; }
  .status-expired { background: #feebc8; color: #7b341e; }
  .status-suspended { background: #fed7d7; color: #822727; }
  .tenant-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tenant-actions .btn { margin-bottom: 0; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tenant-actions .btn-full { grid-column: span 2; }
  @media (min-width: 768px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
    .tenant-actions { grid-template-columns: 1fr 1fr 1fr; }
    .tenant-actions .btn-full { grid-column: span 1; }
  }
</style>
</head>
<body>

<div id="adminLogin">
  <div class="login-box">
    <h1>👑 Super Admin Panel</h1>
    <div id="loginError" style="color:red; text-align:center; margin-bottom:10px; font-size:13px; display:none;"></div>
    <div class="form-group"><label>📧 Admin Email</label><input type="email" id="adminEmail" placeholder="admin@hanitech.com"></div>
    <div class="form-group"><label>🔒 Password</label><input type="password" id="adminPassword" placeholder="••••••••"></div>
    <button class="btn-login" onclick="adminLogin()">🔓 ግባ</button>
  </div>
</div>

<div id="adminApp">
  <header>
    <h1>👑 Super Admin Panel</h1>
    <button class="btn-logout-hdr" onclick="adminLogout()">ውጣ</button>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card"><div class="value val-blue" id="statTotalTenants">0</div><div class="label">📊 ጠቅላላ ፋርማሲዎች</div></div>
      <div class="stat-card"><div class="value val-green" id="statActiveTenants">0</div><div class="label">✅ ተከፋዮች</div></div>
      <div class="stat-card"><div class="value val-orange" id="statExpiredTenants">0</div><div class="label">⏳ ያለፈባቸው</div></div>
      <div class="stat-card"><div class="value val-red" id="statSuspendedTenants">0</div><div class="label">❌ የታገዱ</div></div>
    </div>
    <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
      <div class="stat-card"><div class="value val-green" id="statTotalPaid">0.00</div><div class="label">💰 የተከፈለ (ብር)</div></div>
      <div class="stat-card"><div class="value val-orange" id="statTotalUnpaid">0.00</div><div class="label">⏳ ያልተከፈለ (ብር)</div></div>
    </div>

    <button class="btn btn-success" style="margin-bottom: 16px;" onclick="exportExcel()">📊 Excel (CSV) አውጣ</button>

    <!-- Support Info Section -->
    <div class="section-collapsible">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="sec-left">📞 የድጋፍ መረጃ (Support Info)</div>
        <span class="sec-arrow">▶</span>
      </div>
      <div class="section-body">
        <div class="form-group"><label>ስልክ ቁጥር</label><input type="text" id="supportPhone" placeholder="+251 9XX XXX XXX"></div>
        <div class="form-group"><label>ኢሜይል</label><input type="email" id="supportEmail" placeholder="support@hanitech.com"></div>
        <div class="form-group"><label>ቴሌግራም (Username)</label><input type="text" id="supportTelegram" placeholder="@hanitech_support"></div>
        <button class="btn btn-primary" onclick="saveSupportInfo()">💾 አስቀምጥ</button>
      </div>
    </div>

    <div class="section-collapsible">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="sec-left">🔔 የፓስወርድ ማስተካከያ ጥያቄዎች <span class="badge" id="passReqBadge">0</span></div>
        <span class="sec-arrow">▶</span>
      </div>
      <div class="section-body">
        <div id="passwordRequestsList"></div>
      </div>
    </div>

    <div class="section-collapsible">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="sec-left">➕ አዲስ ፋርማሲ ጨምር</div>
        <span class="sec-arrow">▶</span>
      </div>
      <div class="section-body">
        <div class="form-group"><label>የድርጅት ስም</label><input type="text" id="newTenantName" placeholder="ለምሳሌ: Addis Pharmacy"></div>
        <div class="form-group"><label>ድረ-ገጽ (Website)</label><input type="text" id="newTenantWebsite" placeholder="example.com"></div>
        <div class="form-group"><label>የባለቤት ኢሜይል (Owner)</label><input type="email" id="newTenantOwnerEmail" placeholder="owner@example.com"></div>
        <div class="form-group"><label>የማናጀር ኢሜይል (Manager)</label><input type="email" id="newTenantManagerEmail" placeholder="manager@example.com"></div>
        <div class="form-group"><label>የአካውንታንት ኢሜይል (Accountant)</label><input type="email" id="newTenantAccountantEmail" placeholder="accountant@example.com"></div>
        <div class="form-group">
          <label>🔑 የጊዜያዊ ፓስወርድ (ለሁሉም ተጠቃሚዎች)</label>
          <input type="text" id="newTenantTempPassword" placeholder="ለምሳሌ: 123456" value="123456">
          <div style="font-size:11px; color:#718096; margin-top:4px;">💡 ተጠቃሚዎቹ በዚህ ፓስወርድ ገብተው ወዲያውኑ እንዲቀይሩት ይጠየቃሉ።</div>
        </div>
        <div class="form-group"><label>የክፍያ መጠን (ብር/ወር)</label><input type="number" id="newTenantAmount" placeholder="0.00"></div>
        <div class="form-group"><label>የአገልግሎት ማብቂያ ቀን</label><input type="date" id="newTenantExpiry"></div>
        <button class="btn btn-primary" onclick="addTenant()">💾 ፋርማሲ ፍጠር</button>
      </div>
    </div>

    <div class="section-collapsible">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="sec-left">📋 የፋርማሲዎች ዝርዝር <span class="badge" style="background:#2b6cb0;" id="tenantListBadge">0</span></div>
        <span class="sec-arrow">▶</span>
      </div>
      <div class="section-body">
        <div style="display:flex; gap:8px; margin-bottom:12px; flex-direction:column;">
          <input type="text" id="searchTenant" placeholder="🔍 ፋርማሲ በስም ወይም በኢሜይል ፈልግ..." oninput="renderTenantList()">
          <select id="filterTenantStatus" onchange="renderTenantList()">
            <option value="all">ሁሉም ሁኔታ</option>
            <option value="active">✅ ንቁ</option>
            <option value="expired">⏳ ጊዜው ያለፈባቸው</option>
            <option value="suspended">❌ የታገዱ</option>
          </select>
        </div>
        <div id="tenantList"></div>
      </div>
    </div>

    <div class="section-collapsible">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="sec-left">💾 ዳታ ማስቀመጥ እና መመለስ (Backup / Restore)</div>
        <span class="sec-arrow">▶</span>
      </div>
      <div class="section-body">
        <button class="btn btn-success" style="margin-bottom:10px;" onclick="exportBackup()">📥 ዳታ አውጣ</button>
        <button class="btn btn-warning" onclick="document.getElementById('restoreFile').click()">📤 ዳታ መልስ</button>
        <input type="file" id="restoreFile" accept=".json" style="display:none;" onchange="importBackup(event)">
        <div id="backupStatus" style="margin-top:10px; font-size:13px;"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp, initializeApp as initSecondaryApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, doc, updateDoc, getDoc, setDoc, deleteDoc, writeBatch, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB3bQkI8scEHg36kkxlAalbbCtE4R0Vv8U",
    authDomain: "hanitech-pharmacy-tracker.firebaseapp.com",
    projectId: "hanitech-pharmacy-tracker",
    storageBucket: "hanitech-pharmacy-tracker.firebasestorage.app",
    messagingSenderId: "692991067588",
    appId: "1:692991067588:web:5f0cab885c4aaa64785091"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const SUPER_ADMIN_EMAIL = "admin@hanitech.com"; 

  let allTenants = [];
  let allPasswordRequests = [];
  let currentSupportInfo = { phone: '', email: '', telegram: '' };

  window.toggleSection = function(header) {
    const body = header.nextElementSibling;
    const isOpen = body.classList.toggle('open');
    header.classList.toggle('open', isOpen);
  };

  window.adminLogin = async function() {
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('adminPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    if (email !== SUPER_ADMIN_EMAIL) {
      errorEl.textContent = '⚠️ እርስዎ Super Admin አይደሉም!';
      errorEl.style.display = 'block';
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      errorEl.textContent = '⚠️ ስህተት: Email ወይም Password ትክክል አይደለም';
      errorEl.style.display = 'block';
    }
  };

  window.adminLogout = function() { signOut(auth); };

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === SUPER_ADMIN_EMAIL) {
      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      loadAdminData();
    } else {
      document.getElementById('adminLogin').style.display = 'flex';
      document.getElementById('adminApp').style.display = 'none';
    }
  });

  async function loadAdminData() {
    try {
      const snap = await getDocs(collection(db, 'pharmacies'));
      allTenants = [];
      snap.forEach(d => allTenants.push({ id: d.id, ...d.data() }));
      renderStats();
      renderTenantList();
    } catch(e) { console.error(e); }

    try {
      const snap = await getDocs(collection(db, 'passwordRequests'));
      allPasswordRequests = [];
      snap.forEach(d => allPasswordRequests.push({ id: d.id, ...d.data() }));
      renderPasswordRequests();
    } catch(e) { console.error(e); }

    try {
      const supportDoc = await getDoc(doc(db, 'settings', 'support'));
      if (supportDoc.exists()) {
        currentSupportInfo = supportDoc.data();
        document.getElementById('supportPhone').value = currentSupportInfo.phone || '';
        document.getElementById('supportEmail').value = currentSupportInfo.email || '';
        document.getElementById('supportTelegram').value = currentSupportInfo.telegram || '';
      }
    } catch(e) { console.error("Error loading support info:", e); }
  }

  window.saveSupportInfo = async function() {
    const phone = document.getElementById('supportPhone').value.trim();
    const email = document.getElementById('supportEmail').value.trim();
    const telegram = document.getElementById('supportTelegram').value.trim();

    try {
      await setDoc(doc(db, 'settings', 'support'), { phone, email, telegram }, { merge: true });
      alert('✅ የድጋፍ መረጃ ተቀምጧል!');
    } catch(e) {
      alert('⚠️ ስህተት: ' + e.message);
    }
  };

  function renderStats() {
    let active = 0, expired = 0, suspended = 0, totalPaid = 0, totalUnpaid = 0;
    const today = new Date().toISOString().split('T')[0];

    allTenants.forEach(t => {
      const paid = parseFloat(t.amount) || 0;
      const expiry = t.expiryDate || '';

      if (t.isSuspended) {
        suspended++;
        totalUnpaid += paid;
      } else if (expiry && expiry < today) {
        expired++;
        totalUnpaid += paid;
      } else {
        active++;
        totalPaid += paid;
      }
    });

    document.getElementById('statTotalTenants').innerText = allTenants.length;
    document.getElementById('statActiveTenants').innerText = active;
    document.getElementById('statExpiredTenants').innerText = expired;
    document.getElementById('statSuspendedTenants').innerText = suspended;
    document.getElementById('statTotalPaid').innerText = totalPaid.toLocaleString('en-US', {minimumFractionDigits:2});
    document.getElementById('statTotalUnpaid').innerText = totalUnpaid.toLocaleString('en-US', {minimumFractionDigits:2});
    document.getElementById('tenantListBadge').innerText = allTenants.length;
  }

  function renderPasswordRequests() {
    const listEl = document.getElementById('passwordRequestsList');
    const badge = document.getElementById('passReqBadge');
    badge.innerText = allPasswordRequests.length;

    if (allPasswordRequests.length === 0) {
      listEl.innerHTML = '<p style="text-align:center; color:#a0aec0; font-size:13px;">ምንም ጥያቄ የለም።</p>';
      return;
    }

    let html = '';
    allPasswordRequests.forEach(req => {
      html += `<div class="list-item" style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #edf2f7;">
        <div>
          <div style="font-weight:600; font-size:13px;">${req.email}</div>
          <div style="font-size:11px; color:#718096;">${req.date || 'ቀን አልተጠቀሰም'}</div>
        </div>
        <button class="btn btn-success btn-sm" style="width:auto;" onclick="resolvePasswordRequest('${req.id}')">✅ ተፈትቷል</button>
      </div>`;
    });
    listEl.innerHTML = html;
  }

  window.resolvePasswordRequest = async function(id) {
    try {
      await deleteDoc(doc(db, 'passwordRequests', id));
      loadAdminData();
      alert('✅ ጥያቄው ተነስቷል!');
    } catch(e) { alert(e.message); }
  };

  function renderTenantList() {
    const listEl = document.getElementById('tenantList');
    const searchVal = (document.getElementById('searchTenant')?.value || '').toLowerCase();
    const filterStatus = document.getElementById('filterTenantStatus')?.value || 'all';
    const today = new Date().toISOString().split('T')[0];

    let filtered = allTenants.filter(t => {
      const matchesSearch = (t.name || '').toLowerCase().includes(searchVal) || 
                            (t.ownerEmail || '').toLowerCase().includes(searchVal) ||
                            (t.website || '').toLowerCase().includes(searchVal);
      
      let statusMatch = true;
      if (filterStatus === 'active') statusMatch = !t.isSuspended && t.expiryDate && t.expiryDate >= today;
      if (filterStatus === 'expired') statusMatch = !t.isSuspended && t.expiryDate && t.expiryDate < today;
      if (filterStatus === 'suspended') statusMatch = t.isSuspended;

      return matchesSearch && statusMatch;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = '<p style="text-align:center; color:#a0aec0; font-size:13px;">ምንም ፋርማሲ አልተገኘም።</p>';
      return;
    }

    let html = '';
    filtered.forEach(t => {
      let statusBadge = '';
      let statusClass = '';
      if (t.isSuspended) { statusBadge = '❌ የታገደ'; statusClass = 'status-suspended'; }
      else if (t.expiryDate && t.expiryDate < today) { statusBadge = '⏳ ጊዜው አልፏል'; statusClass = 'status-expired'; }
      else { statusBadge = '✅ ንቁ'; statusClass = 'status-active'; }

      html += `
      <div class="tenant-card">
        <div class="tenant-header">
          <div class="tenant-title">🏢 ${t.name || 'ስም የለም'}</div>
          <a href="https://${t.website || '#'}" target="_blank" class="tenant-website">🌐 ${t.website || 'ድረ-ገጽ የለም'}</a>
        </div>
        
        <div class="tenant-info">👑 <strong>Owner:</strong> ${t.ownerEmail || 'አልተጠቀሰም'}</div>
        <div class="tenant-info">🎯 <strong>Manager:</strong> ${t.managerEmail || 'አልተጠቀሰም'} • 🧰 <strong>Accountant:</strong> ${t.accountantEmail || 'አልተጠቀሰም'}</div>
        <div class="tenant-info">💰 <strong>ክፍያ:</strong> ${t.amount || 0} ብር/ወር</div>
        
        <div class="badge-status ${statusClass}">${statusBadge} ${t.expiryDate ? `(${t.expiryDate})` : ''}</div>

        <div class="tenant-actions">
          <button class="btn btn-success btn-sm" onclick="markPaid('${t.id}')">💰 ክፍያ ተከፈለ</button>
          <button class="btn btn-info btn-sm" onclick="editTenant('${t.id}')">✏️ አሻሽል</button>
          <button class="btn ${t.isSuspended ? 'btn-success' : 'btn-warning'} btn-sm" onclick="toggleSuspend('${t.id}', ${t.isSuspended})">${t.isSuspended ? '✅ ፍቃድ ስጥ' : '⏸️ አቁም'}</button>
          <button class="btn btn-primary btn-sm" onclick="viewHistory('${t.id}')">📜 ታሪክ (${t.paymentHistory ? t.paymentHistory.length : 0})</button>
          <button class="btn btn-danger btn-sm btn-full" onclick="deleteTenant('${t.id}')">🗑️ አጥፋ</button>
        </div>
      </div>`;
    });
    listEl.innerHTML = html;
  }

  window.addTenant = async function() {
    const name = document.getElementById('newTenantName').value.trim();
    const website = document.getElementById('newTenantWebsite').value.trim();
    const ownerEmail = document.getElementById('newTenantOwnerEmail').value.trim();
    const managerEmail = document.getElementById('newTenantManagerEmail').value.trim();
    const accountantEmail = document.getElementById('newTenantAccountantEmail').value.trim();
    const tempPassword = document.getElementById('newTenantTempPassword').value.trim();
    const amount = parseFloat(document.getElementById('newTenantAmount').value) || 0;
    const expiry = document.getElementById('newTenantExpiry').value;

    if (!name || !ownerEmail || !expiry || !tempPassword) {
      alert('⚠️ እባክዎ ስም፣ የባለቤት ኢሜይል፣ የማብቂያ ቀን እና የጊዜያዊ ፓስወርድ ይሙሉ!');
      return;
    }
    if (tempPassword.length < 6) {
      alert('⚠️ የጊዜያዊ ፓስወርድ ቢያንስ 6 ፊደል መሆን አለበት!');
      return;
    }

    try {
      const newPharmacyRef = await addDoc(collection(db, 'pharmacies'), {
        name: name,
        website: website,
        ownerEmail: ownerEmail,
        managerEmail: managerEmail,
        accountantEmail: accountantEmail,
        amount: amount,
        expiryDate: expiry,
        isSuspended: false,
        paymentHistory: [],
        createdAt: new Date().toISOString()
      });
      
      const pharmacyId = newPharmacyRef.id;
      const emailsToCreate = [
        { email: ownerEmail, role: 'owner' },
        { email: managerEmail, role: 'manager' },
        { email: accountantEmail, role: 'accountant' }
      ].filter(u => u.email !== '');

      let createdCount = 0;
      let errors = [];

      const secondaryApp = initSecondaryApp(firebaseConfig, "SecondaryApp-" + Date.now());
      const secondaryAuth = getAuth(secondaryApp);

      try {
        for (const userObj of emailsToCreate) {
          try {
            const userCredential = await createUserWithEmailAndPassword(secondaryAuth, userObj.email, tempPassword);
            const uid = userCredential.user.uid;

            await setDoc(doc(db, 'users', uid), {
              email: userObj.email,
              role: userObj.role,
              pharmacyId: pharmacyId,
              isTempPassword: true,
              createdAt: new Date().toISOString()
            });
            createdCount++;
          } catch(err) {
            errors.push(`${userObj.email}: ${err.message}`);
          }
        }
      } finally {
        await deleteApp(secondaryApp);
      }

      if (errors.length > 0) {
        alert(`⚠️ ፋርማሲው ተፈጥሯል ግን አንዳንድ ተጠቃሚዎች ላይ ስህተት አለ:\n${errors.join('\n')}`);
      } else {
        alert(`✅ ፋርማሲው እና ${createdCount} ተጠቃሚዎች በተሳካ ሁኔታ ተፈጥረዋል!`);
      }

      document.getElementById('newTenantName').value = '';
      document.getElementById('newTenantWebsite').value = '';
      document.getElementById('newTenantOwnerEmail').value = '';
      document.getElementById('newTenantManagerEmail').value = '';
      document.getElementById('newTenantAccountantEmail').value = '';
      document.getElementById('newTenantTempPassword').value = '123456';
      document.getElementById('newTenantAmount').value = '';
      document.getElementById('newTenantExpiry').value = '';
      loadAdminData();

    } catch(e) { 
      alert('⚠️ ስህተት: ' + e.message); 
    }
  };

  window.markPaid = async function(id) {
    const tenant = allTenants.find(t => t.id === id);
    if(!tenant) return;
    
    const months = prompt('ለስንት ወር ክፍያ ተከፍሏል? (ቁጥር ብቻ ያስገቡ)', '1');
    if (!months || isNaN(months)) return;

    const today = new Date();
    let currentExpiry = tenant.expiryDate ? new Date(tenant.expiryDate) : new Date();
    if (currentExpiry < today) currentExpiry = today;
    
    currentExpiry.setMonth(currentExpiry.getMonth() + parseInt(months));
    const newExpiry = currentExpiry.toISOString().split('T')[0];
    
    const monthlyAmount = parseFloat(tenant.amount) || 0;
    const history = tenant.paymentHistory || [];
    history.push({ date: today.toISOString().split('T')[0], amount: monthlyAmount * parseInt(months), months: parseInt(months) });

    try {
      await updateDoc(doc(db, 'pharmacies', id), { 
        expiryDate: newExpiry, 
        isSuspended: false,
        paymentHistory: history
      });
      alert(`✅ ክፍያ ተመዝግቧል! አዲስ የማብቂያ ቀን: ${newExpiry}`);
      loadAdminData();
    } catch(e) { alert(e.message); }
  };

  window.toggleSuspend = async function(id, currentStatus) {
    try {
      await updateDoc(doc(db, 'pharmacies', id), { isSuspended: !currentStatus });
      loadAdminData();
    } catch(e) { alert(e.message); }
  };

  window.deleteTenant = async function(id) {
    if(!confirm('ይህን ፋርማሲ ማጥፋት ትፈልጋለህ? ይህ ተግባር አይመለስም!')) return;
    try {
      await deleteDoc(doc(db, 'pharmacies', id));
      loadAdminData();
      alert('✅ ተጠፍቷል!');
    } catch(e) { alert(e.message); }
  };

  window.editTenant = function(id) {
    const t = allTenants.find(x => x.id === id);
    if(!t) return;
    const newName = prompt('አዲስ የፋርማሲ ስም:', t.name);
    const newWebsite = prompt('አዲስ ድረ-ገጽ:', t.website);
    const newAmount = prompt('አዲስ የክፍያ መጠን:', t.amount);
    
    if (newName !== null) {
      updateDoc(doc(db, 'pharmacies', id), { 
        name: newName, 
        website: newWebsite || '', 
        amount: parseFloat(newAmount) || 0 
      }).then(() => { alert('✅ ተስተካክሏል!'); loadAdminData(); }).catch(e => alert(e.message));
    }
  };

  window.viewHistory = function(id) {
    const t = allTenants.find(x => x.id === id);
    if(!t || !t.paymentHistory || t.paymentHistory.length === 0) {
      alert('📜 እስካሁን ምንም የክፍያ ታሪክ የለም።');
      return;
    }
    let historyText = '📜 የክፍያ ታሪክ:\n\n';
    t.paymentHistory.forEach(h => {
      historyText += `📅 ${h.date} - ${h.amount} ብር (${h.months} ወር)\n`;
    });
    alert(historyText);
  };

  window.exportExcel = function() {
    if (allTenants.length === 0) { alert('ውሂብ የለም'); return; }
    let csv = '\uFEFFስም,ድረ-ገጽ,ባለቤት,ማናጀር,አካውንታንት,የክፍያ መጠን,የማብቂያ ቀን,ሁኔታ\n';
    allTenants.forEach(t => {
      const status = t.isSuspended ? 'የታገደ' : 'ንቁ';
      csv += `"${t.name}","${t.website||''}","${t.ownerEmail||''}","${t.managerEmail||''}","${t.accountantEmail||''}",${t.amount || 0},"${t.expiryDate || ''}","${status}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `admin-pharmacies-${new Date().toISOString().split('T')[0]}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  window.exportBackup = async function() {
    const statusEl = document.getElementById('backupStatus');
    statusEl.textContent = '⏳ ዳታ በመሰብሰብ ላይ...';
    try {
      const data = { tenants: allTenants, passwordRequests: allPasswordRequests };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `admin-backup-${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      statusEl.textContent = '✅ ዳታ ወርዷል!'; statusEl.style.color = '#38a169';
    } catch(e) { statusEl.textContent = '❌ ' + e.message; statusEl.style.color = '#c53030'; }
  };

  window.importBackup = function(event) {
    const file = event.target.files[0]; if (!file) return;
    if (!confirm('⚠️ ዳታ መመለስ አሁን ያለውን ዳታ ይተካል! እርግጠኛ ነህ?')) { event.target.value = ''; return; }
    const statusEl = document.getElementById('backupStatus');
    statusEl.textContent = '⏳ በመመለስ ላይ...';
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        for (const t of data.tenants || []) { const { id, ...rest } = t; await setDoc(doc(db, 'pharmacies', id), rest); }
        statusEl.textContent = '✅ ዳታ ተመልሷል!'; statusEl.style.color = '#38a169';
        loadAdminData();
      } catch(err) { statusEl.textContent = '❌ ' + err.message; statusEl.style.color = '#c53030'; }
    };
    reader.readAsText(file); event.target.value = '';
  };
</script>

<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanitech Pharmacy Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #f0f4f8; color: #1a202c; padding-bottom: 80px; }
  
  #loginScreen { position: fixed; inset: 0; background: #2b6cb0; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .login-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  .login-box h1 { text-align: center; color: #2b6cb0; margin-bottom: 20px; font-size: 22px;}
  input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 16px; background: #f7fafc; }
  button { width: 100%; padding: 12px; background: #2b6cb0; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;}
  button:hover { background: #2c5282; }

  #mainApp { display: none; }
  header { background: #2b6cb0; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;}
  .container { padding: 15px; max-width: 800px; margin: 0 auto; }
  
  .tabs { display: flex; background: white; border-radius: 10px; padding: 5px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-x: auto; gap: 5px;}
  .tabs button { background: transparent; color: #4a5568; border: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; white-space: nowrap;}
  .tabs button.active { background: #ebf8ff; color: #2b6cb0; font-weight: bold;}
  
  .section-collapsible { background: white; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; }
  .section-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; cursor: pointer; user-select: none; background: #fff; }
  .section-header:hover { background: #f7fafc; }
  .section-header .sec-title { font-weight: bold; font-size: 16px; color: #2b6cb0; display: flex; align-items: center; gap: 8px;}
  .section-header .sec-arrow { transition: transform 0.2s; font-size: 12px; color: #a0aec0;}
  .section-header.open .sec-arrow { transform: rotate(90deg); }
  .section-body { display: none; padding: 0 20px 20px 20px; border-top: 1px solid #edf2f7; padding-top: 15px;}
  .section-body.open { display: block; }
  
  .form-group { margin-bottom: 15px; }
  label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #4a5568;}
  
  .list-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #edf2f7; align-items: center;}
  .list-item:last-child { border-bottom: none; }
  .item-info h3 { font-size: 16px; margin-bottom: 4px; color: #2d3748;}
  .item-info p { font-size: 12px; color: #718096; }
  .item-price { font-weight: bold; color: #2b6cb0; text-align: right;}
  
  .btn-logout { background: #e53e3e; padding: 8px 12px; width: auto; font-size: 14px; }
  .btn-danger { background: #e53e3e; }
  .btn-success { background: #38a169; }
  .error { color: #e53e3e; font-size: 14px; text-align: center; margin-bottom: 10px; display: none; background: #fff5f5; padding: 10px; border-radius: 8px;}
  
  .stat-box { background: linear-gradient(135deg, #2b6cb0, #2c5282); color: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center;}
  .stat-box h3 { font-size: 14px; font-weight: normal; opacity: 0.9; margin-bottom: 5px;}
  .stat-box .value { font-size: 28px; font-weight: bold;}
  
  .expiry-alert { color: #e53e3e; font-weight: bold; font-size: 12px; }
  .low-stock { color: #dd6b20; font-weight: bold; font-size: 12px; }

  #expiryBanner { display: none; background: #fff5f5; color: #c53030; padding: 12px; margin: 15px; border-radius: 8px; border: 1px solid #fed7d7; font-weight: bold; font-size: 14px; text-align: center; }
</style>
</head>
<body>

<!-- የመግቢያ ገጽ -->
<div id="loginScreen">
  <div class="login-box">
    <h1>💊 Hanitech Pharmacy</h1>
    <div class="error" id="loginError"></div>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">🔓 ግባ</button>
  </div>
</div>

<!-- ዋና ገጽ -->
<div id="mainApp">
  <header>
    <h2>💊 Pharmacy Tracker</h2>
    <button class="btn-logout" onclick="logout()">ውጣ</button>
  </header>

  <div id="expiryBanner">
    ⚠️ <span id="expiryBannerText"></span>
  </div>
  
  <div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="active" onclick="switchTab('tab-add', this)">➕ መድሃኒት</button>
      <button onclick="switchTab('tab-sell', this)">🛒 ሽያጭ</button>
      <button onclick="switchTab('tab-inventory', this)">📦 ክምችት</button>
      <button onclick="switchTab('tab-daily', this)">📅 የቀን ገቢ</button>
      <button onclick="switchTab('tab-monthly', this)">📆 የወር ገቢ</button>
      <button onclick="switchTab('tab-settings', this)">⚙️ ሴቲንግስ</button>
    </div>

    <!-- 1. መድሃኒት (Category & Add) -->
    <div class="card active" id="tab-add">
      <!-- Category Manager -->
      <div class="section-collapsible">
        <div class="section-header" onclick="toggleSection(this)">
          <div class="sec-title">📁 ምድቦች አስተዳድር</div>
          <div class="sec-arrow">▶</div>
        </div>
        <div class="section-body">
          <div class="form-group"><label>ዋና ምድብ (Category)</label><input type="text" id="newCat" placeholder="ለምሳሌ: አንቲባዮቲክስ"></div>
          <button onclick="addCategory()" style="background:#38a169; margin-bottom:10px;">+ ምድብ ጨምር</button>
          <div id="catListDisplay" style="margin-top:10px;"></div>
        </div>
      </div>

      <!-- Add Medicine -->
      <div class="section-collapsible">
        <div class="section-header open" onclick="toggleSection(this)">
          <div class="sec-title">➕ አዲስ መድሃኒት ጨምር</div>
          <div class="sec-arrow">▶</div>
        </div>
        <div class="section-body open">
          <div class="form-group">
            <label>📁 ዋና ምድብ (Category)</label>
            <select id="medCategory"></select>
          </div>
          <div class="form-group">
            <label>📂 ንዑስ ምድብ (Subcategory)</label>
            <input type="text" id="medSubcategory" placeholder="ለምሳሌ: ታብሌት">
          </div>
          <div class="form-group"><label>💊 የመድሃኒት ስም</label><input type="text" id="medName" placeholder="ለምሳሌ: Paracetamol"></div>
          <div class="form-group"><label>🔢 የባች ቁጥር</label><input type="text" id="medBatch" placeholder="BATCH-001"></div>
          <div class="form-group"><label>📅 የማለቂያ ቀን</label><input type="date" id="medExpiry"></div>
          <div class="form-group"><label>💰 የግዢ ዋጋ</label><input type="number" id="medCost" placeholder="0.00"></div>
          <div class="form-group"><label>🏷️ የሽያጭ ዋጋ</label><input type="number" id="medPrice" placeholder="0.00"></div>
          <div class="form-group"><label>📦 ብዛት</label><input type="number" id="medQty" placeholder="0"></div>
          <button onclick="addMedicine()" style="background:#38a169;">💾 አስቀምጥ</button>
        </div>
      </div>
    </div>

    <!-- 2. ሽያጭ -->
    <div class="card" id="tab-sell">
      <div class="section-collapsible">
        <div class="section-header open" onclick="toggleSection(this)">
          <div class="sec-title">🛒 መድሃኒት ሽያጭ</div>
          <div class="sec-arrow">▶</div>
        </div>
        <div class="section-body open">
          <div class="form-group"><label>📅 የሽያጭ ቀን</label><input type="date" id="sellDate"></div>
          <div class="form-group"><label>💊 መድሃኒት ምረጥ</label><select id="sellMedId" onchange="updateSellPrice()"></select></div>
          <div class="form-group"><label>📦 ብዛት</label><input type="number" id="sellQty" placeholder="0" min="1"></div>
          <div class="form-group"><label>💵 ጠቅላላ ዋጋ</label><input type="text" id="sellTotal" readonly style="background:#edf2f7; font-weight:bold;"></div>
          <button onclick="sellMedicine()" style="background:#38a169;">💸 ሽያጭ አድርግ</button>
        </div>
      </div>
    </div>

    <!-- 3. ክምችት -->
    <div class="card" id="tab-inventory">
      <div class="section-collapsible">
        <div class="section-header open" onclick="toggleSection(this)">
          <div class="sec-title">📦 የእቃ ክምችት</div>
          <div class="sec-arrow">▶</div>
        </div>
        <div class="section-body open">
          <div id="inventoryList"></div>
        </div>
      </div>
    </div>

    <!-- 4. የቀን ገቢ -->
    <div class="card" id="tab-daily">
      <div class="section-collapsible">
        <div class="section-header open" onclick="toggleSection(this)">
          <div class="sec-title">📅 የቀን ገቢ</div>
          <div class="sec-arrow">▶</div>
        </div>
        <div class="section-body open">
          <div class="form-group"><label>ቀን ምረጥ</label><input type="date" id="dailyReportDate" onchange="loadDailyReport()"></div>
          <div class="stat-box" style="background: linear-gradient(135deg, #38a169, #2f855a);">
            <h3>የተመረጠው ቀን ገቢ</h3>
            <div class="value" id="dailyTotalRevenue">0.00 ብር</div>
          </div>
          <div id="dailySalesList"></div>
        </div>
      </div>
    </div>

    <!-- 5. የወር ገቢ -->
    <div class="card" id="tab-monthly">
      <div class="section-collapsible">
        <div class="section-header open" onclick="toggleSection(this)">
          <div class="sec-title">📆 የወር ገቢ</div>
          <div class="sec-arrow">▶</div>
        </div>
        <div class="section-body open">
          <div class="form-group"><label>ወር ምረጥ</label><input type="month" id="monthlyReportMonth" onchange="loadMonthlyReport()"></div>
          <div class="stat-box" style="background: linear-gradient(135deg, #2b6cb0, #2c5282);">
            <h3>የተመረጠው ወር ገቢ</h3>
            <div class="value" id="monthlyTotalRevenue">0.00 ብር</div>
          </div>
          <div id="monthlySalesList"></div>
        </div>
      </div>
    </div>

    <!-- 6. ሴቲንግስ -->
    <div class="card" id="tab-settings">
      <div class="section-collapsible">
        <div class="section-header open" onclick="toggleSection(this)">
          <div class="sec-title">⚙️ ሴቲንግስ</div>
          <div class="sec-arrow">▶</div>
        </div>
        <div class="section-body open">
          <div class="form-group"><label>🏥 የፋርማሲ ስም</label><input type="text" id="settingPharmacyName"></div>
          <button onclick="savePharmacyName()" style="background:#2b6cb0; margin-bottom:20px;">💾 አስቀምጥ</button>
          <div style="border-top:1px solid #edf2f7; padding-top:20px;">
            <h3 style="font-size:15px; margin-bottom:15px; color:#4a5568;">🔐 ፓስወርድ ቀይር</h3>
            <div class="form-group"><label>የአሁኑ ፓስወርድ</label><input type="password" id="currentPass"></div>
            <div class="form-group"><label>አዲስ ፓስወርድ</label><input type="password" id="newPass"></div>
            <button onclick="changePassword()" style="background:#dd6b20;">🔐 ፓስወርድ ቀይር</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, increment, where, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB3bQkI8scEHg36kkxlAalbbCtE4R0Vv8U",
    authDomain: "hanitech-pharmacy-tracker.firebaseapp.com",
    projectId: "hanitech-pharmacy-tracker",
    storageBucket: "hanitech-pharmacy-tracker.firebasestorage.app",
    messagingSenderId: "692991067588",
    appId: "1:692991067588:web:5f0cab885c4aaa64785091"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let allMedicines = []; 
  let allCategories = [];
  let currentUserPharmacyId = null;

  window.toggleSection = function(headerEl) {
    const body = headerEl.nextElementSibling;
    headerEl.classList.toggle('open');
    body.classList.toggle('open');
  };

  window.switchTab = function(tabId, btn) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
    
    if (tabId === 'tab-inventory') loadInventory();
    if (tabId === 'tab-sell') loadSellOptions();
    if (tabId === 'tab-daily') loadDailyReport();
    if (tabId === 'tab-monthly') loadMonthlyReport();
    if (tabId === 'tab-settings') loadSettings();
    if (tabId === 'tab-add') loadCategories();
  };

  window.login = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    try {
      const userCred = await signInWithEmailAndPassword(auth, email, password);
      const userDoc = await getDoc(doc(db, 'users', userCred.user.uid));
      if(userDoc.exists()) currentUserPharmacyId = userDoc.data().pharmacyId;
    } catch (err) {
      errorEl.textContent = '⚠️ ስህተት: Email ወይም Password ትክክል አይደለም';
      errorEl.style.display = 'block';
    }
  };

  window.logout = function() { signOut(auth); };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      loadAllData();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
    }
  });

  async function loadAllData() {
    await loadCategories();
    await loadMedicines();
    loadInventory();
    loadSellOptions();
    loadDailyReport();
    loadMonthlyReport();
    loadSettings();
    checkExpiryAlerts();
  }

  // --- ምድቦች (Categories) ---
  async function loadCategories() {
    try {
      const snap = await getDocs(collection(db, 'categories'));
      allCategories = [];
      const select = document.getElementById('medCategory');
      select.innerHTML = '<option value="">-- ምድብ ምረጥ --</option>';
      
      snap.forEach(doc => {
        const catName = doc.data().name;
        allCategories.push(catName);
        select.innerHTML += `<option value="${catName}">${catName}</option>`;
      });
      renderCategoryList();
    } catch(e) { console.error(e); }
  }

  function renderCategoryList() {
    const listEl = document.getElementById('catListDisplay');
    if(allCategories.length === 0) { listEl.innerHTML = '<p style="font-size:13px; color:#a0aec0;">ምንም ምድብ የለም።</p>'; return; }
    let html = '';
    allCategories.forEach(c => {
      html += `<div class="list-item"><div class="item-info"><h3>📁 ${c}</h3></div><button class="btn-danger" style="width:auto; padding:5px 10px; font-size:12px;" onclick="deleteCategory('${c}')">🗑️</button></div>`;
    });
    listEl.innerHTML = html;
  }

  window.addCategory = async function() {
    const name = document.getElementById('newCat').value.trim();
    if(!name) { alert('ስም አስገባ'); return; }
    try {
      await setDoc(doc(db, 'categories', name), { name: name });
      document.getElementById('newCat').value = '';
      loadCategories();
      alert('✅ ምድብ ተጨምሯል!');
    } catch(e) { alert(e.message); }
  };

  window.deleteCategory = async function(name) {
    if(!confirm('ይህን ምድብ ማጥፋት ትፈልጋለህ?')) return;
    try {
      await deleteDoc(doc(db, 'categories', name));
      loadCategories();
    } catch(e) { alert(e.message); }
  };

  // --- መድሃኒት ማስቀመጥ ---
  window.addMedicine = async function() {
    const category = document.getElementById('medCategory').value;
    const subcategory = document.getElementById('medSubcategory').value.trim();
    const name = document.getElementById('medName').value.trim();
    const batch = document.getElementById('medBatch').value.trim();
    const expiry = document.getElementById('medExpiry').value;
    const cost = parseFloat(document.getElementById('medCost').value);
    const price = parseFloat(document.getElementById('medPrice').value);
    const qty = parseInt(document.getElementById('medQty').value);

    if (!category || !subcategory || !name || !batch || !expiry || isNaN(cost) || isNaN(price) || isNaN(qty) || qty <= 0) {
      alert('⚠️ እባክህ ሁሉንም መረጃዎች በትክክል ሙላ!');
      return;
    }

    try {
      await addDoc(collection(db, 'medicines'), {
        category, subcategory, name, batch, expiry, cost, price, quantity: qty, createdAt: serverTimestamp(), pharmacyId: currentUserPharmacyId
      });
      alert('✅ መድሃኒቱ ተመዝግቧል!');
      document.getElementById('medSubcategory').value = '';
      document.getElementById('medName').value = '';
      document.getElementById('medBatch').value = '';
      document.getElementById('medExpiry').value = '';
      document.getElementById('medCost').value = '';
      document.getElementById('medPrice').value = '';
      document.getElementById('medQty').value = '';
      loadAllData();
    } catch (err) { alert('⚠️ ስህተት: ' + err.message); }
  };

  async function loadMedicines() {
    try {
      const q = query(collection(db, 'medicines'), orderBy('createdAt', 'desc'));
      const snapshot = await getDocs(q);
      allMedicines = [];
      snapshot.forEach(doc => allMedicines.push({ id: doc.id, ...doc.data() }));
    } catch (err) { console.error(err); }
  }

  // --- ክምችት ---
  function loadInventory() {
    const listEl = document.getElementById('inventoryList');
    if (allMedicines.length === 0) { listEl.innerHTML = '<p style="text-align:center; color:#a0aec0;">ምንም መድሃኒት የለም።</p>'; return; }
    let html = '';
    const sortedMeds = [...allMedicines].sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
    sortedMeds.forEach(med => {
      const today = new Date(); today.setHours(0,0,0,0);
      const expiryDate = new Date(med.expiry);
      const diffDays = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));
      let alertHtml = ''; let rowStyle = '';
      if (diffDays < 0) { alertHtml = `<span class="expiry-alert">🚨 ጊዜው አልፏል!</span>`; rowStyle = 'background:#fff5f5; border-left: 4px solid #e53e3e;'; }
      else if (diffDays <= 30) { alertHtml = `<span class="expiry-alert" style="color:#dd6b20;">⚠️ ${diffDays} ቀን ቀርቷል</span>`; rowStyle = 'background:#fffaf0; border-left: 4px solid #dd6b20;'; }
      else if (med.quantity <= 10) { alertHtml = '<span class="low-stock">⚠️ ክምችት እያለቀ ነው</span>'; }
      html += `<div class="list-item" style="${rowStyle}"><div class="item-info"><h3>${med.name}</h3><p>📁 ${med.category} → ${med.subcategory}</p><p>📅 ${med.expiry} ${alertHtml}</p></div><div class="item-price"><div style="font-size:18px; ${med.quantity <= 10 ? 'color:#e53e3e;' : ''}">${med.quantity}</div><div style="font-size:12px; color:#a0aec0;">${med.price} ብር</div></div></div>`;
    });
    listEl.innerHTML = html;
  }

  // --- ሽያጭ ---
  function loadSellOptions() {
    const select = document.getElementById('sellMedId');
    const dateInput = document.getElementById('sellDate');
    if(!dateInput.value) dateInput.value = new Date().toISOString().split('T')[0];
    select.innerHTML = '<option value="">-- መድሃኒት ምረጥ --</option>';
    allMedicines.forEach(med => { if (med.quantity > 0) select.innerHTML += `<option value="${med.id}">${med.name} (ቀሪ: ${med.quantity})</option>`; });
  }

  window.updateSellPrice = function() {
    const id = document.getElementById('sellMedId').value;
    if (!id) { document.getElementById('sellTotal').value = '0.00'; return; }
    const med = allMedicines.find(m => m.id === id);
    if (med) { document.getElementById('sellQty').value = 1; document.getElementById('sellTotal').value = med.price.toFixed(2); }
  };

  document.getElementById('sellQty')?.addEventListener('input', () => {
    const id = document.getElementById('sellMedId').value;
    const qty = parseInt(document.getElementById('sellQty').value) || 0;
    if (!id) return;
    const med = allMedicines.find(m => m.id === id);
    if (med) document.getElementById('sellTotal').value = (med.price * qty).toFixed(2);
  });

  window.sellMedicine = async function() {
    const id = document.getElementById('sellMedId').value;
    const qty = parseInt(document.getElementById('sellQty').value);
    const sellDate = document.getElementById('sellDate').value;
    if (!id || isNaN(qty) || qty <= 0 || !sellDate) { alert('⚠️ እባክህ መድሃኒት፣ ትክክለኛ ብዛት እና ቀን ምረጥ'); return; }
    const med = allMedicines.find(m => m.id === id);
    if (med.quantity < qty) { alert(`⚠️ በቂ ክምችት የለም! ያለው: ${med.quantity}`); return; }
    const total = med.price * qty;
    try {
      await addDoc(collection(db, 'sales'), { medicineId: id, medicineName: med.name, quantity: qty, unitPrice: med.price, total: total, date: sellDate, timestamp: serverTimestamp(), pharmacyId: currentUserPharmacyId });
      await updateDoc(doc(db, 'medicines', id), { quantity: increment(-qty) });
      alert(`✅ ሽያጭ ተመዝግቧል!\n${med.name} x ${qty} = ${total.toFixed(2)} ብር`);
      loadAllData();
      document.getElementById('sellQty').value = '';
      document.getElementById('sellTotal').value = '';
      document.getElementById('sellMedId').value = '';
    } catch (err) { alert('⚠️ ስህተት: ' + err.message); }
  };

  // --- የቀን ገቢ ---
  async function loadDailyReport() {
    const dateInput = document.getElementById('dailyReportDate');
    if(!dateInput.value) dateInput.value = new Date().toISOString().split('T')[0];
    const selectedDate = dateInput.value;
    
    try {
      const q = query(collection(db, 'sales'), where('date', '==', selectedDate));
      const snap = await getDocs(q);
      let total = 0;
      let html = '';
      
      snap.forEach(doc => {
        const sale = doc.data();
        total += sale.total;
        html += `<div class="list-item"><div class="item-info"><h3>${sale.medicineName}</h3><p>ብዛት: ${sale.quantity} x ${sale.unitPrice} ብር</p></div><div class="item-price">${sale.total.toFixed(2)} ብር</div></div>`;
      });
      
      document.getElementById('dailyTotalRevenue').innerText = total.toFixed(2) + ' ብር';
      document.getElementById('dailySalesList').innerHTML = html || '<p style="text-align:center; color:#a0aec0;">በዚህ ቀን ምንም ሽያጭ የለም።</p>';
    } catch(e) { console.error(e); }
  }

  // --- የወር ገቢ ---
  async function loadMonthlyReport() {
    const monthInput = document.getElementById('monthlyReportMonth');
    if(!monthInput.value) monthInput.value = new Date().toISOString().slice(0,7);
    const selectedMonth = monthInput.value;
    const firstDay = selectedMonth + '-01';
    const lastDay = selectedMonth + '-31'; // ግምታዊ
    
    try {
      const q = query(collection(db, 'sales'), where('date', '>=', firstDay), where('date', '<=', lastDay));
      const snap = await getDocs(q);
      let total = 0;
      let html = '';
      
      snap.forEach(doc => {
        const sale = doc.data();
        total += sale.total;
        html += `<div class="list-item"><div class="item-info"><h3>${sale.medicineName}</h3><p>${sale.date} | ብዛት: ${sale.quantity}</p></div><div class="item-price">${sale.total.toFixed(2)} ብር</div></div>`;
      });
      
      document.getElementById('monthlyTotalRevenue').innerText = total.toFixed(2) + ' ብር';
      document.getElementById('monthlySalesList').innerHTML = html || '<p style="text-align:center; color:#a0aec0;">በዚህ ወር ምንም ሽያጭ የለም።</p>';
    } catch(e) { console.error(e); }
  }

  // --- ሴቲንግስ ---
  function loadSettings() {
    if(currentUserPharmacyId) {
      getDoc(doc(db, 'pharmacies', currentUserPharmacyId)).then(d => {
        if(d.exists()) document.getElementById('settingPharmacyName').value = d.data().name || '';
      });
    }
  }

  window.savePharmacyName = async function() {
    const name = document.getElementById('settingPharmacyName').value.trim();
    if(!name || !currentUserPharmacyId) return;
    try {
      await updateDoc(doc(db, 'pharmacies', currentUserPharmacyId), { name: name });
      alert('✅ ተቀይሯል!');
    } catch(e) { alert(e.message); }
  };

  window.changePassword = async function() {
    const currentPass = document.getElementById('currentPass').value;
    const newPass = document.getElementById('newPass').value;
    if (!currentPass || !newPass) { alert('ሁለቱንም ፓስወርዶች ሙላ'); return; }
    if (newPass.length < 6) { alert('አዲሱ ፓስወርድ ቢያንስ 6 ፊደል ይሁን'); return; }
    try {
      const user = auth.currentUser;
      const credential = EmailAuthProvider.credential(user.email, currentPass);
      await reauthenticateWithCredential(user, credential);
      await updatePassword(user, newPass);
      alert('✅ ፓስወርድ ተቀይሯል!');
      document.getElementById('currentPass').value = '';
      document.getElementById('newPass').value = '';
    } catch (err) { alert('ስህተት: ' + err.message); }
  };

  // --- የማለቂያ ቀን ማሳወቂያ ---
  function checkExpiryAlerts() {
    const banner = document.getElementById('expiryBanner');
    const bannerText = document.getElementById('expiryBannerText');
    const today = new Date(); today.setHours(0,0,0,0);
    let expiredCount = 0;
    let expiringSoonCount = 0;

    allMedicines.forEach(med => {
      const expiryDate = new Date(med.expiry);
      const diffDays = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) expiredCount++;
      else if (diffDays <= 30) expiringSoonCount++;
    });

    if (expiredCount > 0 || expiringSoonCount > 0) {
      banner.style.display = 'block';
      let msg = '';
      if (expiredCount > 0) msg += `${expiredCount} መድሃኒት ጊዜው አልፏል! `;
      if (expiringSoonCount > 0) msg += `${expiringSoonCount} መድሃኒት በ30 ቀን ውስጥ ያልቃል!`;
      bannerText.textContent = msg;
    } else {
      banner.style.display = 'none';
    }
  }

</script>
